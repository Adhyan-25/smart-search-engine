# Load balancer config for 2 Node instances (section 27).
# Round-robin by default; "ip_hash" would pin a client to one instance,
# which is exactly the scenario the distributed-rate-limiter section exists
# to handle correctly even when NOT using ip_hash.

events {
  worker_connections 1024;
}

http {
  upstream smart_search_backend {
    server node1:4000;
    server node2:4001;
  }

  server {
    listen 8080;

    location /api/ {
      proxy_pass http://smart_search_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://client:5173;
    }
  }
}
